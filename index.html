<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diário de Aulas</title>
  
  <!-- LIGANDO O MANIFESTO PARA INSTALAÇÃO -->
  <link rel="manifest" href="manifest.json">
  
  <meta name="theme-color" content="#4338ca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diário Aulas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Diário Aulas">
  
  <link rel="icon" type="image/png" sizes="512x512" href="https://img.icons8.com/fluency/512/diary.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/diary.png">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  
  <!-- SCRIPT DO SERVICE WORKER PARA PERMITIR INSTALAÇÃO -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

  <!-- COLE O SEU LINK DO GOOGLE SCRIPT AQUI DENTRO DO src=" " -->
  <iframe src="COLE_O_SEU_LINK_DO_GOOGLE_SCRIPT_AQUI"></iframe>

</body>
</html>
